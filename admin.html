<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Admin Panel - SABBIR VAI FF SHOP</title>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <style>
 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: Arial, sans-serif;
 }

 body {
 background: #f4f6f8;
 color: #222;
 }

 header {
 background: #111827;
 color: white;
 padding: 20px;
 text-align: center;
 }

 header h1 {
 font-size: 24px;
 }

 header p {
 margin-top: 6px;
 color: #bbb;
 font-size: 14px;
 }

 .container {
 max-width: 900px;
 margin: 25px auto;
 padding: 15px;
 }

 .card {
 background: white;
 padding: 20px;
 border-radius: 14px;
 margin-bottom: 20px;
 box-shadow: 0 4px 15px rgba(0,0,0,0.08);
 }

 .card h2 {
 margin-bottom: 15px;
 }

 .email {
 color: #555;
 word-break: break-all;
 }

 button,
 .btn {
 border: none;
 padding: 12px 18px;
 border-radius: 8px;
 cursor: pointer;
 font-size: 15px;
 text-decoration: none;
 display: inline-block;
 margin: 5px 5px 5px 0;
 }

 .home {
 background: #2563eb;
 color: white;
 }

 .logout {
 background: #dc2626;
 color: white;
 }

 .add {
 background: #16a34a;
 color: white;
 }

 .status {
 padding: 12px;
 border-radius: 8px;
 background: #fef3c7;
 margin-top: 15px;
 }
 </style>
</head>

<body>

<header>
 <h1> ADMIN PANEL</h1>
 <p>SABBIR VAI FF SHOP</p>
</header>

<div class="container">

 <div class="card">
 <h2> Admin Account</h2>

 <p class="email" id="adminEmail">Checking...</p>

 <br>

 <a href="index.html" class="btn home"> Website</a>
 <button onclick="logout()" class="logout">Logout</button>

 <div class="status" id="status">
 Checking admin permission...
 </div>
 </div>

 <div class="card">
 <h2> Product Management</h2>

 <button class="add" onclick="addProduct()">
 Add New Product
 </button>

 <p style="margin-top:15px;color:#777;">
 Product Add / Edit / Delete system will be connected here.
 </p>
 </div>

</div>

<script>

 // আপনার Supabase project-এর একই URL ও Publishable Key এখানে থাকবে
const SUPABASE_URL = "https://lqwysworzitvulwpbvwe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dX32O3XdjpI4ws7Jqz_DSQ_WBOpAzG2";

 const supabaseClient =
 supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

 async function checkAdmin() {

 const { data: sessionData } =
 await supabaseClient.auth.getSession();

 if (!sessionData.session) {
 window.location.href = "login.html";
 return;
 }

 const user = sessionData.session.user;

 document.getElementById("adminEmail").innerText =
 user.email;

 const { data, error } =
 await supabaseClient
 .from("admins")
 .select("email")
 .eq("email", user.email)
 .maybeSingle();

 if (error || !data) {

 document.getElementById("status").innerText =
 " You are not an admin.";

 document.querySelector(".add").style.display = "none";

 return;
 }

 document.getElementById("status").innerText =
 " Admin access confirmed.";
 }


 async function logout() {

 await supabaseClient.auth.signOut();

 window.location.href = "index.html";
 }


 function addProduct() {

 alert("Product Add System will be added next.");
 }


 checkAdmin();

</script>

</body>
</html>
