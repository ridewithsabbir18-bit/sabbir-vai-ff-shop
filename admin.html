<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - SABBIR VAI FF SHOP</title>

<style>
* {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
}

body {
 font-family: Arial, sans-serif;
 background: #f4f6f8;
 color: #222;
 padding: 20px;
}

.container {
 max-width: 900px;
 margin: auto;
}

h1 {
 text-align: center;
 margin-bottom: 20px;
}

.box {
 background: white;
 padding: 20px;
 margin-bottom: 20px;
 border-radius: 12px;
 box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input,
textarea,
select {
 width: 100%;
 padding: 12px;
 margin: 7px 0 14px;
 border: 1px solid #ccc;
 border-radius: 8px;
 font-size: 15px;
}

textarea {
 min-height: 90px;
 resize: vertical;
}

button {
 border: none;
 padding: 11px 18px;
 border-radius: 8px;
 cursor: pointer;
 font-size: 15px;
 font-weight: bold;
}

.add-btn {
 background: #16a34a;
 color: white;
 width: 100%;
}

.edit-btn {
 background: #2563eb;
 color: white;
 margin-right: 5px;
}

.delete-btn {
 background: #dc2626;
 color: white;
}

.cancel-btn {
 background: #777;
 color: white;
 margin-top: 8px;
 width: 100%;
}

.package-box {
 background: #f8fafc;
 border: 1px solid #ddd;
 padding: 12px;
 margin-top: 12px;
 border-radius: 10px;
}

.package-item {
 background: white;
 border: 1px solid #ddd;
 padding: 12px;
 border-radius: 8px;
 margin-top: 8px;
}

.package-item strong {
 color: #16a34a;
}

.package-actions {
 margin-top: 10px;
}

.package-edit {
 background: #2563eb;
 color: white;
 margin-right: 5px;
}

.package-delete {
 background: #dc2626;
 color: white;
}

.product {
 border: 1px solid #ddd;
 padding: 15px;
 border-radius: 10px;
 margin-top: 12px;
}

.product h3 {
 margin-bottom: 8px;
}

.product p {
 margin: 6px 0;
}

.product img {
 max-width: 150px;
 max-height: 120px;
 object-fit: contain;
 border-radius: 8px;
 margin: 8px 0;
}

.success {
 color: green;
 margin: 10px 0;
 font-weight: bold;
}

.error {
 color: red;
 margin: 10px 0;
 font-weight: bold;
}

.hidden {
 display: none;
}

.small-title {
 margin-top: 15px;
 margin-bottom: 8px;
}

.package-form {
 margin-top: 12px;
 padding: 12px;
 background: #eef2ff;
 border-radius: 10px;
}

.package-save {
 background: #16a34a;
 color: white;
 width: 100%;
}

.package-cancel {
 background: #777;
 color: white;
 width: 100%;
 margin-top: 7px;
}
</style>
</head>

<body>

<div class="container">

<h1>
SABBIR VAI FF SHOP<br>
Admin Panel
</h1>

<div id="message"></div>


<!-- ADD / EDIT PRODUCT -->

<div class="box">

<h2 id="formTitle">Add New Product</h2>

<form id="productForm">

<label>Product Name</label>

<input
type="text"
id="name"
placeholder="Example: DOLPHIN PANEL"
required
>


<label>Description</label>

<textarea
id="description"
placeholder="Product description"
></textarea>


<label>Price (৳)</label>

<input
type="number"
id="price"
placeholder="500"
required
>


<label>Duration</label>

<input
type="text"
id="duration"
placeholder="7 Days"
required
>


<label>Image URL</label>

<input
type="text"
id="image_url"
placeholder="https://..."
>


<label>Download URL</label>

<input
type="text"
id="download_url"
placeholder="https://..."
>


<label>Status</label>

<select id="status">

<option value="Active">
Active
</option>

<option value="Inactive">
Inactive
</option>

</select>


<button
type="submit"
class="add-btn"
id="submitBtn"
>
Add Product
</button>


<button
type="button"
class="cancel-btn hidden"
id="cancelBtn"
onclick="cancelEdit()"
>
Cancel Edit
</button>

</form>

</div>


<!-- PRODUCT LIST -->

<div class="box">

<h2>Products</h2>

<div id="productList">
Loading products...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lqwysworzitvulwpbvwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_dX32O3XdjpI4ws7Jqz_DSQ_WBOpAzG2";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let editingId = null;

let editingPackageId = null;


/* =========================
MESSAGE
========================= */

function showMessage(text, type = "success") {

const message =
document.getElementById("message");

message.className = type;

message.textContent = text;

setTimeout(() => {

message.textContent = "";

}, 4000);

}


/* =========================
CHECK ADMIN
========================= */

async function checkAdmin() {

const {
data: { session },
error: sessionError
} =
await supabaseClient.auth.getSession();


if (sessionError || !session) {

alert("Please login first.");

window.location.href =
"login.html";

return false;

}


const email =
session.user.email;


const { data, error } =
await supabaseClient

.from("admins")

.select("email")

.eq("email", email)

.maybeSingle();


if (error || !data) {

document.body.innerHTML = `

<div style="
text-align:center;
margin-top:100px;
font-family:Arial;
">

<h2>Access Denied</h2>

<p>
You are not an admin.
</p>

</div>

`;

return false;

}


return true;

}


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts() {

const productList =
document.getElementById("productList");

productList.innerHTML =
"Loading products...";


const { data, error } =
await supabaseClient

.from("products")

.select("*")

.order(
"created_at",
{ ascending: false }
);


if (error) {

productList.innerHTML = `

<p class="error">
${escapeHTML(error.message)}
</p>

`;

return;

}


if (!data || data.length === 0) {

productList.innerHTML =
"<p>No products found.</p>";

return;

}


productList.innerHTML = "";


for (const product of data) {

const div =
document.createElement("div");

div.className =
"product";


let imageHTML = "";


if (product.image_url) {

imageHTML = `

<img
src="${escapeHTML(product.image_url)}"
alt="Product Image"
>

`;

}


div.innerHTML = `

<h3>
${escapeHTML(product.name || "")}
</h3>

${imageHTML}

<p>
<b>Description:</b>
${escapeHTML(
product.description || "-"
)}
</p>

<p>
<b>Product Price:</b>
৳${product.price ?? 0}
</p>

<p>
<b>Duration:</b>
${escapeHTML(
product.duration || "-"
)}
</p>

<p>
<b>Status:</b>
${escapeHTML(
product.status || "-"
)}
</p>

<br>

<button
class="edit-btn"
onclick="editProduct('${product.id}')"
>
Edit
</button>

<button
class="delete-btn"
onclick="deleteProduct('${product.id}')"
>
Delete
</button>

<div class="package-box">

<h3>
Packages
</h3>

<div id="packages-${product.id}">
Loading packages...
</div>

<button
class="add-btn"
style="margin-top:10px;"
onclick="showPackageForm('${product.id}')"
>
+ Add Package
</button>

<div
id="package-form-${product.id}"
class="package-form hidden"
>

<h4 id="package-form-title-${product.id}">
Add Package
</h4>

<input
type="text"
id="package-duration-${product.id}"
placeholder="Example: 7 Days"
>

<input
type="number"
id="package-price-${product.id}"
placeholder="Example: 500"
>

<button
class="package-save"
onclick="savePackage('${product.id}')"
>
Save Package
</button>

<button
class="package-cancel"
onclick="cancelPackage('${product.id}')"
>
Cancel
</button>

</div>

</div>

`;


productList.appendChild(div);

await loadPackages(product.id);

}

}


/* =========================
LOAD PACKAGES
========================= */

async function loadPackages(productId) {

const box =
document.getElementById(
`packages-${productId}`
);


if (!box) return;


const { data, error } =
await supabaseClient

.from("product_packages")

.select("*")

.eq("product_id", productId)

.order(
"price",
{ ascending: true }
);


if (error) {

box.innerHTML = `

<p class="error">
${escapeHTML(error.message)}
</p>

`;

return;

}


if (!data || data.length === 0) {

box.innerHTML =
"<p>No packages found.</p>";

return;

}


box.innerHTML = "";


data.forEach(pkg => {

const item =
document.createElement("div");

item.className =
"package-item";


item.innerHTML = `

<strong>
${escapeHTML(pkg.duration)}
</strong>

&nbsp; — &nbsp;

৳${pkg.price}

<div class="package-actions">

<button
class="package-edit"
onclick="editPackage(
'${pkg.id}',
'${productId}',
'${escapeHTML(pkg.duration)}',
'${pkg.price}'
)"
>
Edit
</button>

<button
class="package-delete"
onclick="deletePackage('${pkg.id}','${productId}')"
>
Delete
</button>

</div>

`;

box.appendChild(item);

});

}


/* =========================
SHOW PACKAGE FORM
========================= */

function showPackageForm(productId) {

editingPackageId = null;


document
.getElementById(
`package-form-${productId}`
)
.classList
.remove("hidden");


document
.getElementById(
`package-duration-${productId}`
)
.value = "";


document
.getElementById(
`package-price-${productId}`
)
.value = "";


document
.getElementById(
`package-form-title-${productId}`
)
.textContent =
"Add Package";

}


/* =========================
EDIT PACKAGE
========================= */

function editPackage(
packageId,
productId,
duration,
price
) {

editingPackageId = packageId;


document
.getElementById(
`package-form-${productId}`
)
.classList
.remove("hidden");


document
.getElementById(
`package-duration-${productId}`
)
.value = duration;


document
.getElementById(
`package-price-${productId}`
)
.value = price;


document
.getElementById(
`package-form-title-${productId}`
)
.textContent =
"Edit Package";

}


/* =========================
SAVE PACKAGE
========================= */

async function savePackage(productId) {

const duration =
document
.getElementById(
`package-duration-${productId}`
)
.value
.trim();


const price =
document
.getElementById(
`package-price-${productId}`
)
.value;


if (!duration || !price) {

showMessage(
"Duration and price are required.",
"error"
);

return;

}


const packageData = {

product_id: Number(productId),

duration: duration,

price: Number(price)

};


let error;


if (editingPackageId) {

const result =
await supabaseClient

.from("product_packages")

.update(packageData)

.eq("id", editingPackageId);

error = result.error;

} else {

const result =
await supabaseClient

.from("product_packages")

.insert([packageData]);

error = result.error;

}


if (error) {

showMessage(
"Package save failed: " +
error.message,
"error"
);

return;

}


showMessage(
editingPackageId
? "Package updated successfully!"
: "Package added successfully!"
);


editingPackageId = null;


cancelPackage(productId);

await loadPackages(productId);

}


/* =========================
CANCEL PACKAGE
========================= */

function cancelPackage(productId) {

editingPackageId = null;


const form =
document.getElementById(
`package-form-${productId}`
);


if (form) {

form.classList.add("hidden");

}

}


/* =========================
DELETE PACKAGE
========================= */

async function deletePackage(
packageId,
productId
) {

const confirmDelete =
confirm(
"Are you sure you want to delete this package?"
);


if (!confirmDelete) {

return;

}


const { error } =
await supabaseClient

.from("product_packages")

.delete()

.eq("id", packageId);


if (error) {

showMessage(
"Package delete failed: " +
error.message,
"error"
);

return;

}


showMessage(
"Package deleted successfully!"
);


await loadPackages(productId);

}


/* =========================
ADD / UPDATE PRODUCT
========================= */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(e) {

e.preventDefault();


const name =
document
.getElementById("name")
.value
.trim();


const description =
document
.getElementById("description")
.value
.trim();


const price =
document
.getElementById("price")
.value;


const duration =
document
.getElementById("duration")
.value
.trim();


const image_url =
document
.getElementById("image_url")
.value
.trim();


const download_url =
document
.getElementById("download_url")
.value
.trim();


const status =
document
.getElementById("status")
.value;


if (!name || !price || !duration) {

showMessage(
"Name, Price and Duration are required.",
"error"
);

return;

}


const productData = {

name: name,

description: description,

price: Number(price),

duration: duration,

image_url: image_url,

download_url: download_url,

status: status

};


/* UPDATE */

if (editingId) {

const { error } =
await supabaseClient

.from("products")

.update(productData)

.eq("id", editingId);


if (error) {

showMessage(
"Update failed: " +
error.message,
"error"
);

return;

}


showMessage(
"Product updated successfully!"
);


cancelEdit();

await loadProducts();

return;

}


/* INSERT */

const { error } =
await supabaseClient

.from("products")

.insert([productData]);


if (error) {

showMessage(
"Add failed: " +
error.message,
"error"
);

return;

}


showMessage(
"Product successfully added!"
);


document
.getElementById("productForm")
.reset();


await loadProducts();

}
);


/* =========================
EDIT PRODUCT
========================= */

async function editProduct(id) {

const { data, error } =
await supabaseClient

.from("products")

.select("*")

.eq("id", id)

.single();


if (error) {

showMessage(
"Could not load product.",
"error"
);

return;

}


editingId = id;


document
.getElementById("name")
.value =
data.name || "";


document
.getElementById("description")
.value =
data.description || "";


document
.getElementById("price")
.value =
data.price || "";


document
.getElementById("duration")
.value =
data.duration || "";


document
.getElementById("image_url")
.value =
data.image_url || "";


document
.getElementById("download_url")
.value =
data.download_url || "";


document
.getElementById("status")
.value =
data.status || "Active";


document
.getElementById("formTitle")
.textContent =
"Edit Product";


document
.getElementById("submitBtn")
.textContent =
"Update Product";


document
.getElementById("cancelBtn")
.classList
.remove("hidden");


window.scrollTo({
top: 0,
behavior: "smooth"
});

}


/* =========================
CANCEL EDIT
========================= */

function cancelEdit() {

editingId = null;


document
.getElementById("productForm")
.reset();


document
.getElementById("formTitle")
.textContent =
"Add New Product";


document
.getElementById("submitBtn")
.textContent =
"Add Product";


document
.getElementById("cancelBtn")
.classList
.add("hidden");

}


/* =========================
DELETE PRODUCT
========================= */

async function deleteProduct(id) {

const confirmDelete =
confirm(
"Are you sure you want to delete this product?"
);


if (!confirmDelete) {

return;

}


const { error } =
await supabaseClient

.from("products")

.delete()

.eq("id", id);


if (error) {

showMessage(
"Delete failed: " +
error.message,
"error"
);

return;

}


showMessage(
"Product deleted successfully!"
);


await loadProducts();

}


/* =========================
HTML SECURITY
========================= */

function escapeHTML(value) {

return String(value)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


/* =========================
START
========================= */

(async function() {

const isAdmin =
await checkAdmin();


if (isAdmin) {

await loadProducts();

}

})();

</script>

</body>
</html>
