}

.product-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

.product-card {
background: #1e293b;

display: flex;
justify-content: center;
align-items: center;
font-size: 50px;
}

.product-card h3 {
font-size: 22px;
margin-bottom: 10px;
}

.product-card p {
color: #94a3b8;
margin-bottom: 20px;
}

.price {
color: #22c55e;
font-size: 20px;
font-weight: bold;
margin-bottom: 20px;
}

.btn {
display: inline-block;
background: #22c55e;
color: #052e16;
text-decoration: none;
padding: 12px 25px;
border-radius: 8px;
font-weight: bold;
transition: 0.2s;
}

.btn:hover {
background: #16a34a;
color: white;
transform: scale(1.03);
}

footer {
margin-top: 30px;
padding: 25px;
text-align: center;
background: #111827;
color: #94a3b8;
}

@media (max-width: 600px) {
header {
flex-direction: column;
gap: 12px;

nav {
gap: 10px;
