<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - SABBIR VAI FF SHOP</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
background: #0f172a;
color: white;
}

header {
background: #111827;
padding: 18px 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
color: #22c55e;
font-size: 20px;
font-weight: bold;
}

header a {
color: white;
text-decoration: none;
}

.container {
max-width: 600px;
margin: 40px auto;
padding: 20px;
}

.card {
background: #1e293b;
border: 1px solid #334155;
border-radius: 15px;
padding: 25px;
text-align: center;
}

.product-image {
width: 120px;
height: 120px;
margin: auto;
background: #0f172a;
border-radius: 20px;
display: flex;
align-items: center;
justify-content: center;
font-size: 55px;
overflow: hidden;
}

.product-image img {
width: 100%;
height: 100%;
object-fit: cover;
}

h1 {
margin: 20px 0 10px;
}

.description {
color: #94a3b8;
margin-bottom: 25px;
}

.package {
background: #0f172a;
border: 1px solid #334155;
border-radius: 10px;
padding: 15px;
margin: 10px 0;
cursor: pointer;
}

.package:hover {
border-color: #22c55e;
}

.package.active {
border: 2px solid #22c55e;
}

.package-title {
font-size: 18px;
font-weight: bold;
}

.package-price {
color: #22c55e;
font-size: 20px;
font-weight: bold;
margin-top: 5px;
}

.buy-btn {
width: 100%;
border: none;
background: #22c55e;
color: #052e16;
padding: 14px;
border-radius: 8px;
font-size: 16px;
font-weight: bold;
margin-top: 20px;
cursor: pointer;
}

.buy-btn:hover {
background: #16a34a;
color: white;
}

.loading {
text-align: center;
color: #94a3b8;
}

.error {
text-align: center;
color: #ef4444;
}

.selected {
margin-top: 18px;
color: #cbd5e1;
}

</style>
</head>

<body>

<header>

<div class="logo">
SABBIR VAI FF SHOP
</div>

<a href="index.html">
Home
</a>

</header>


<div class="container">

<div id="content">

<div class="loading">
Loading product...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lqwysworzitvulwpbvwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_dX32O3XdjpI4ws7Jqz_DSQ_WBOpAzG2";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


// Get product ID from URL

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


let productData = null;

let selectedDays = "7 Days";

let selectedPrice = 500;


// Load product

async function loadProduct() {

if (!productId) {

document.getElementById("content").innerHTML = `
<div class="error">
Product not found.
</div>
`;

return;

}


const { data, error } =
await supabaseClient

.from("products")

.select("*")

.eq("id", productId)

.single();


if (error || !data) {

document.getElementById("content").innerHTML = `
<div class="error">
Unable to load product.
</div>
`;

return;

}


productData = data;


// Show product

let imageHTML = "🐬";


if (data.image_url) {

imageHTML = `
<img
src="${escapeHTML(data.image_url)}"
alt="Product"
>
`;

}


document.getElementById("content").innerHTML = `

<div class="card">

<div class="product-image">

${imageHTML}

</div>


<h1>
${escapeHTML(data.name)}
</h1>


<div class="description">

${escapeHTML(
data.description ||
"Premium Free Fire Panel"
)}

</div>


<div
class="package active"
onclick="selectPackage('7 Days', 500, this)"
>

<div class="package-title">
7 Days
</div>

<div class="package-price">
৳500
</div>

</div>


<div
class="package"
onclick="selectPackage('15 Days', 900, this)"
>

<div class="package-title">
15 Days
</div>

<div class="package-price">
৳900
</div>

</div>


<div
class="package"
onclick="selectPackage('30 Days', 1500, this)"
>

<div class="package-title">
30 Days
</div>

<div class="package-price">
৳1500
</div>

</div>


<div class="selected">

Selected:
<span id="selectedDays">
7 Days
</span>

<br>

Price:
৳<span id="selectedPrice">
500
</span>

</div>


<button
class="buy-btn"
onclick="continuePayment()"
>
CONTINUE TO PAYMENT
</button>


</div>

`;

}


// Select package

function selectPackage(
days,
price,
element
) {

selectedDays = days;

selectedPrice = price;


document
.querySelectorAll(".package")
.forEach(item => {

item.classList.remove("active");

});


element.classList.add("active");


document.getElementById(
"selectedDays"
).textContent = days;


document.getElementById(
"selectedPrice"
).textContent = price;

}


// Continue payment

function continuePayment() {

window.location.href =
"payment.html" +
"?product=" +
encodeURIComponent(productData.name) +
"&days=" +
encodeURIComponent(selectedDays) +
"&price=" +
encodeURIComponent(selectedPrice);

}


// HTML security

function escapeHTML(value) {

return String(value)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


loadProduct();

</script>

</body>
</html>
