<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - SABBIR VAI FF SHOP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
background: #0f172a;
color: white;
min-height: 100vh;
}

header {
background: #020617;
padding: 18px 20px;
text-align: center;
border-bottom: 1px solid #1e293b;
}

header h1 {
color: #22c55e;
font-size: 24px;
}

.container {
width: 92%;
max-width: 700px;
margin: 30px auto;
}

.product-card {
background: #111827;
border: 1px solid #1f2937;
border-radius: 16px;
padding: 25px;
text-align: center;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.product-image {
width: 130px;
height: 130px;
object-fit: cover;
border-radius: 15px;
margin-bottom: 15px;
background: #1e293b;
}

.emoji-image {
width: 130px;
height: 130px;
display: flex;
align-items: center;
justify-content: center;
font-size: 70px;
margin: 0 auto 15px;
background: #1e293b;
border-radius: 15px;
}

h2 {
color: #22c55e;
margin-bottom: 10px;
}

.description {
color: #cbd5e1;
margin-bottom: 25px;
line-height: 1.6;
}

.package-title {
font-size: 20px;
margin-bottom: 15px;
}

.packages {
display: grid;
gap: 12px;
margin-bottom: 25px;
}

.package {
background: #1e293b;
border: 2px solid #334155;
border-radius: 12px;
padding: 15px;
cursor: pointer;
transition: 0.2s;
text-align: left;
}

.package:hover {
border-color: #22c55e;
}

.package.selected {
border-color: #22c55e;
background: #172554;
}

.package-name {
font-size: 18px;
font-weight: bold;
}

.package-price {
color: #22c55e;
font-size: 20px;
font-weight: bold;
margin-top: 5px;
}

.buy-btn {
width: 100%;
padding: 15px;
border: none;
border-radius: 10px;
background: #22c55e;
color: #020617;
font-size: 18px;
font-weight: bold;
cursor: pointer;
}

.buy-btn:hover {
background: #16a34a;
}

.message {
text-align: center;
padding: 30px;
color: #cbd5e1;
}

.error {
color: #ef4444;
}
</style>
</head>

<body>

<header>
<h1>SABBIR VAI FF SHOP</h1>
</header>

<div class="container">

<div id="loading" class="message">
Loading product...
</div>

<div id="productBox" class="product-card" style="display:none;">

<div id="imageBox"></div>

<h2 id="productName"></h2>

<p id="productDescription" class="description"></p>

<div class="package-title">
Select Package
</div>

<div id="packages" class="packages"></div>

<button class="buy-btn" onclick="continuePayment()">
BUY NOW
</button>

</div>

</div>

<script>

const SUPABASE_URL = "https://lqwysworzitvulwpbvwe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_dX32O3XdjpI4ws7Jqz_DSQ_WBOpAzG2";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let selectedPackage = null;
let product = null;


async function loadProduct() {

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

if (!productId) {
showError("Product ID not found.");
return;
}


// Load product
const { data: productData, error: productError } =
await supabaseClient
.from("products")
.select("*")
.eq("id", productId)
.single();


if (productError || !productData) {
console.error(productError);
showError("Product not found.");
return;
}


product = productData;


document.getElementById("productName").textContent =
product.name || "Product";


document.getElementById("productDescription").textContent =
product.description || "";


// Product image
const imageBox = document.getElementById("imageBox");

if (product.image_url) {

imageBox.innerHTML = `
<img
src="${product.image_url}"
class="product-image"
alt="${product.name}"
>
`;

} else {

imageBox.innerHTML = `
<div class="emoji-image">🐬</div>
`;

}


// Load packages
const { data: packages, error: packageError } =
await supabaseClient
.from("product_packages")
.select("*")
.eq("product_id", product.id)
.order("price", { ascending: true });


if (packageError) {
console.error(packageError);
showError("Package load failed.");
return;
}


const packagesBox = document.getElementById("packages");

packagesBox.innerHTML = "";


if (!packages || packages.length === 0) {

packagesBox.innerHTML = `
<p class="message">
No package available.
</p>
`;

} else {

packages.forEach((pkg, index) => {

const div = document.createElement("div");

div.className = "package";

div.innerHTML = `
<div class="package-name">
${pkg.duration}
</div>

<div class="package-price">
৳${pkg.price}
</div>
`;


div.addEventListener("click", function() {

document
.querySelectorAll(".package")
.forEach(item => {
item.classList.remove("selected");
});


div.classList.add("selected");

selectedPackage = pkg;

});


packagesBox.appendChild(div);


// First package selected automatically
if (index === 0) {

div.classList.add("selected");

selectedPackage = pkg;

}

});

}


document.getElementById("loading").style.display = "none";

document.getElementById("productBox").style.display = "block";

}


function continuePayment() {

if (!selectedPackage) {

alert("Please select a package first.");

return;
}


const productName =
encodeURIComponent(product.name);

const days =
encodeURIComponent(selectedPackage.duration);

const price =
encodeURIComponent(selectedPackage.price);


window.location.href =
`payment.html?product=${productName}&days=${days}&price=${price}`;

}


function showError(message) {

document.getElementById("loading").innerHTML =
`<div class="error">${message}</div>`;

}


loadProduct();

</script>

</body>
</html>
